[project]
name = "source_system"
version = "0.0.1"
description = "Bronze ingestion for the source_system producer."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest", "pyspark", "chispa"]
